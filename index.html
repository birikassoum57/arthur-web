<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Arthur</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0F1115" />
<link rel="apple-touch-icon" href="icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1115;
    --surface: #171A21;
    --surface-raised: #1E222B;
    --border: #2A2F3A;
    --text: #EDEEF0;
    --text-muted: #8A8F98;
    --accent: #C9A227;
    --accent-dim: #8A7420;
    --accent-text: #17140A;
    --danger: #C0524A;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    overscroll-behavior: none;
  }

  h1, h2, .display {
    font-family: 'Newsreader', Georgia, serif;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  #app {
    height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  .login-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 28px calc(32px + env(safe-area-inset-bottom));
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }

  .login-mark {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }
  .login-mark span {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .login-screen h1 {
    font-size: 34px;
    line-height: 1.15;
    margin: 0 0 8px;
  }
  .login-screen .sub {
    color: var(--text-muted);
    font-size: 15px;
    line-height: 1.5;
    margin: 0 0 36px;
  }

  .field {
    margin-bottom: 16px;
  }
  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .field input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 15px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
  }
  .field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 10px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    margin-top: 8px;
  }
  .btn-primary:active { background: var(--accent-dim); }
  .btn-primary:disabled { opacity: 0.5; }

  .btn-text {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-family: inherit;
    padding: 14px 0;
    width: 100%;
  }

  .form-error {
    color: var(--danger);
    font-size: 13px;
    margin: -6px 0 14px;
    min-height: 16px;
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: calc(14px + env(safe-area-inset-top)) 20px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  .chat-header .who {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .chat-header .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
  .chat-header h2 {
    font-size: 18px;
    margin: 0;
  }
  .chat-header button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    font-family: inherit;
    padding: 6px;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .msg {
    max-width: 84%;
    padding: 12px 15px;
    border-radius: 16px;
    font-size: 15.5px;
    line-height: 1.5;
    word-wrap: break-word;
  }
  .msg p { margin: 0 0 8px; }
  .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0; padding-left: 20px; }
  .msg li { margin-bottom: 4px; }
  .msg strong { font-weight: 700; }
  .msg img {
    max-width: 100%;
    border-radius: 10px;
    margin-top: 6px;
    display: block;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 5px;
    white-space: pre-wrap;
  }
  .msg.user img {
    margin-top: 0;
    margin-bottom: 8px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
  }
  .msg.error {
    align-self: flex-start;
    background: rgba(192, 82, 74, 0.12);
    border: 1px solid var(--danger);
    color: #E8A29C;
    border-bottom-left-radius: 5px;
    white-space: pre-wrap;
  }
  .msg.pending {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 5px;
    color: var(--text-muted);
    display: flex;
    gap: 4px;
    padding: 14px 16px;
  }
  .msg.pending span {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .msg.pending span:nth-child(2) { animation-delay: 0.15s; }
  .msg.pending span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse {
    0%, 60%, 100% { opacity: 0.3; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 32px;
    color: var(--text-muted);
  }
  .empty-state .display {
    color: var(--text);
    font-size: 22px;
    margin-bottom: 8px;
  }
  .empty-state p {
    font-size: 14.5px;
    line-height: 1.5;
    margin: 0;
  }

  .preview-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .preview-bar img {
    width: 48px;
    height: 48px;
    object-fit: cover;
    border-radius: 8px;
  }
  .preview-bar .preview-name {
    flex: 1;
    font-size: 13px;
    color: var(--text-muted);
  }
  .preview-bar button {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 13px;
    font-family: inherit;
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .composer textarea {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 16px;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
    resize: none;
    max-height: 120px;
    line-height: 1.4;
  }
  .composer textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  .composer button.round {
    width: 42px;
    height: 42px;
    min-width: 42px;
    border-radius: 50%;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .composer button:disabled {
    opacity: 0.4;
  }
  .composer .mic-btn, .composer .attach-btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .composer .mic-btn.listening {
    background: var(--danger);
    color: white;
    animation: mic-pulse 1s infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .hidden { display: none !important; }

  .top-error {
    background: rgba(192, 82, 74, 0.15);
    border: 1px solid var(--danger);
    color: #E8A29C;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>
<div id="app">

  <div id="login-screen" class="login-screen">
    <div class="login-mark"><span></span></div>
    <h1 class="display">Arthur</h1>
    <p class="sub">Ton assistant personnel. Connecte-toi pour continuer — il te reconnaîtra sur n'importe quel appareil.</p>

    <div id="login-error" class="top-error hidden"></div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" autocomplete="email" inputmode="email" />
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" autocomplete="current-password" />
    </div>
    <div class="form-error" id="field-error"></div>

    <button class="btn-primary" id="login-btn">Se connecter</button>
    <button class="btn-text" id="signup-btn">Pas encore de compte ? Créer un compte</button>
  </div>

  <div id="chat-screen" class="hidden" style="flex:1; display:flex; flex-direction:column; min-height:0;">
    <div class="chat-header">
      <div class="who">
        <div class="dot"></div>
        <h2>Arthur</h2>
      </div>
      <button id="logout-btn">Déconnexion</button>
    </div>

    <div class="messages" id="messages">
      <div class="empty-state" id="empty-state">
        <div class="display">Dis bonjour à Arthur</div>
        <p>"Retiens que..." pour mémoriser<br/>"Génère une image de..." pour dessiner<br/>📎 pour analyser une photo</p>
      </div>
    </div>

    <div class="preview-bar hidden" id="preview-bar">
      <img id="preview-img" src="" alt="Aperçu" />
      <div class="preview-name" id="preview-name">Photo prête</div>
      <button id="preview-remove">Retirer</button>
    </div>

    <div class="composer">
      <button class="round attach-btn" id="attach-btn" title="Joindre une photo">📎</button>
      <input type="file" id="file-input" accept="image/*" class="hidden" />
      <button class="round mic-btn" id="mic-btn" title="Dicter un message">🎤</button>
      <textarea id="input" placeholder="Écris à Arthur…" rows="1"></textarea>
      <button class="round" id="send-btn">↑</button>
    </div>
  </div>

</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = "https://sttmszahjvsgjumnmxvc.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_1A5_EJlxj5wTQCqSTFrVZA_8yFhehZg";
const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/quick-handler`;

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const loginScreen = document.getElementById('login-screen');
const chatScreen = document.getElementById('chat-screen');
const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');
const loginBtn = document.getElementById('login-btn');
const signupBtn = document.getElementById('signup-btn');
const loginError = document.getElementById('login-error');
const fieldError = document.getElementById('field-error');
const logoutBtn = document.getElementById('logout-btn');
const messagesEl = document.getElementById('messages');
const emptyState = document.getElementById('empty-state');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const micBtn = document.getElementById('mic-btn');
const attachBtn = document.getElementById('attach-btn');
const fileInput = document.getElementById('file-input');
const previewBar = document.getElementById('preview-bar');
const previewImg = document.getElementById('preview-img');
const previewRemove = document.getElementById('preview-remove');

let pendingImage = null; // base64 data URL

function showError(msg) {
  loginError.textContent = msg;
  loginError.classList.remove('hidden');
}
function clearError() {
  loginError.classList.add('hidden');
  fieldError.textContent = '';
}

async function handleLogin() {
  clearError();
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  if (!email || !password) {
    fieldError.textContent = "Renseigne ton email et ton mot de passe.";
    return;
  }
  loginBtn.disabled = true;
  loginBtn.textContent = "Connexion…";
  const { error } = await supabase.auth.signInWithPassword({ email, password });
  loginBtn.disabled = false;
  loginBtn.textContent = "Se connecter";
  if (error) {
    showError(error.message);
    return;
  }
  enterChat();
}

async function handleSignup() {
  clearError();
  const email = emailInput.value.trim();
  const password = passwordInput.value;
  if (!email || !password) {
    fieldError.textContent = "Renseigne un email et un mot de passe.";
    return;
  }
  if (password.length < 6) {
    fieldError.textContent = "Le mot de passe doit faire au moins 6 caractères.";
    return;
  }
  signupBtn.disabled = true;
  const { error } = await supabase.auth.signUp({ email, password });
  signupBtn.disabled = false;
  if (error) {
    showError(error.message);
    return;
  }
  showError("Compte créé. Si la confirmation par email est activée, vérifie ta boîte mail avant de te connecter.");
}

async function handleLogout() {
  await supabase.auth.signOut();
  chatScreen.classList.add('hidden');
  loginScreen.classList.remove('hidden');
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyState);
}

function renderContent(content) {
  const escape = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const imgMatch = content.match(/(https:\/\/image\.pollinations\.ai\/prompt\/[^\s]+)/);
  let textPart = content;
  let imgHtml = '';
  if (imgMatch) {
    textPart = content.replace(imgMatch[0], '').trim();
    imgHtml = `<img src="${imgMatch[0]}" alt="Image générée" loading="lazy" />`;
  }
  let html = escape(textPart);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ul>${m}</ul>`);
  html = html.split('\n\n').map(p => p.trim() ? `<p>${p.replace(/\n/g, '<br>')}</p>` : '').join('');
  return html + imgHtml;
}

function addMessage(role, content, imageDataUrl) {
  emptyState.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  let html = '';
  if (imageDataUrl) {
    html += `<img src="${imageDataUrl}" alt="Photo envoyée" />`;
  }
  if (role === 'assistant') {
    html += renderContent(content);
  } else {
    html += `<span>${content.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</span>`;
  }
  div.innerHTML = html;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function addPending() {
  const div = document.createElement('div');
  div.className = 'msg pending';
  div.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  const imageToSend = pendingImage;
  if (!text && !imageToSend) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage('user', text || "Analyse cette image.", imageToSend);
  clearPreview();
  const pending = addPending();

  try {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      pending.remove();
      addMessage('error', "Ta session a expiré. Déconnecte-toi et reconnecte-toi.");
      sendBtn.disabled = false;
      return;
    }
    const res = await fetch(FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ message: text || "Analyse cette image.", image: imageToSend || undefined }),
    });
    const data = await res.json();
    pending.remove();
    if (data.error) {
      addMessage('error', `Erreur : ${data.error}`);
    } else {
      addMessage('assistant', data.reply || "Je n'ai pas pu répondre, réessaie.");
    }
  } catch (e) {
    pending.remove();
    addMessage('error', `Connexion impossible : ${e.message || e}`);
  }
  sendBtn.disabled = false;
}

function enterChat() {
  loginScreen.classList.add('hidden');
  chatScreen.classList.remove('hidden');
  loadHistory();
}

async function loadHistory() {
  const { data, error } = await supabase
    .from('arthur_messages')
    .select('role, content, created_at')
    .order('created_at', { ascending: true })
    .limit(50);
  if (error || !data || data.length === 0) return;
  emptyState.remove();
  data.forEach(m => addMessage(m.role, m.content));
}

function clearPreview() {
  pendingImage = null;
  previewBar.classList.add('hidden');
  fileInput.value = '';
}

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    pendingImage = reader.result;
    previewImg.src = pendingImage;
    previewBar.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
});
previewRemove.addEventListener('click', clearPreview);

loginBtn.addEventListener('click', handleLogin);
signupBtn.addEventListener('click', handleSignup);
logoutBtn.addEventListener('click', handleLogout);
sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizing = false;
let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'fr-FR';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    inputEl.value = (inputEl.value ? inputEl.value + ' ' : '') + transcript;
    inputEl.dispatchEvent(new Event('input'));
  };
  recognition.onend = () => {
    recognizing = false;
    micBtn.classList.remove('listening');
  };
  recognition.onerror = () => {
    recognizing = false;
    micBtn.classList.remove('listening');
  };

  micBtn.addEventListener('click', () => {
    if (recognizing) {
      recognition.stop();
      return;
    }
    recognizing = true;
    micBtn.classList.add('listening');
    recognition.start();
  });
} else {
  micBtn.style.display = 'none';
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

(async () => {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) enterChat();
})();
</script>
</body>
  </html>
